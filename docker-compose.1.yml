services:
  mysql:
    image: mysql:8.0                 # 推荐指定具体版本，如 8.0 或 8.4 (LTS)
    container_name: mysql-server     # 容器名称
    restart: unless-stopped          # 重启策略：除非手动停止，否则自动重启
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      # MYSQL_DATABASE: "${MYSQL_DATABASE}"  # 可选：自动创建初始数据库
      # MYSQL_USER: "${MYSQL_USER}"          # 可选：创建普通用户
      # MYSQL_PASSWORD: "${MYSQL_PASSWORD}"  # 可选：普通用户密码
    ports:
      - "3306:3306"                  # 端口映射
    volumes:
      # 数据持久化：冒号左边是 Windows 路径，右边是容器内路径
      - ./data:/var/lib/mysql
      # 配置文件挂载
      - ./config/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # 初始化脚本挂载（容器首次启动时会自动执行这里的 .sql 文件）
      - ./init:/docker-entrypoint-initdb.d
    command:
      - --default-authentication-plugin=mysql_native_password   # 兼容旧版客户端认证插件
